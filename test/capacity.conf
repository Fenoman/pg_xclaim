## pg_xclaim capacity-test configuration
## Used by: make installcheck-capacity
## max_claims=64: above the dynahash 32-freelist floor, below the
## production default. Never use a value below 32 (dynahash floor).

shared_preload_libraries = 'pg_xclaim'
pg_xclaim.max_claims = 64
pg_xclaim.num_partitions = 4
pg_xclaim.expected_claims_per_backend = 32
pg_xclaim.enabled = on
