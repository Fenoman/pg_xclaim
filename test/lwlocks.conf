## pg_xclaim lwlocks-guard test configuration.
## Used by: make installcheck-lwlocks
##
## num_partitions=256 deliberately exceeds the all-partition snapshot
## helpers' 192-LWLock budget (PG MAX_SIMUL_LWLOCKS ~ 200 with headroom
## for catalog access). xclaim.debug() and xclaim.debug_snapshot() must
## raise a clean ERROR with ERRCODE_FEATURE_NOT_SUPPORTED and an
## actionable hint rather than leaking partition locks or letting PG
## core's "too many LWLocks taken" assertion fire.

shared_preload_libraries = 'pg_xclaim'
pg_xclaim.max_claims = 1024
pg_xclaim.num_partitions = 256
pg_xclaim.expected_claims_per_backend = 256
pg_xclaim.enabled = on
